# .github/workflows/daily-scrape.yml
# ============================================================
# Daily E-com Price + Comment Scraper
# Runs every day at 7:00 AM IST (1:30 AM UTC)
# ============================================================
#
# SETUP (one-time):
# 1. Go to your GitHub repo → Settings → Secrets and variables → Actions
# 2. Add these Repository Secrets:
#    SUPABASE_URL        → your Supabase project URL (e.g. https://abc.supabase.co)
#    SUPABASE_SERVICE_KEY → your Supabase service_role key (NOT anon key)
#
# Manual trigger: Go to Actions tab → Daily E-com Scraper → Run workflow
# ============================================================

name: Daily E-com Scraper

on:
  # Run daily at 7:00 AM IST = 01:30 UTC
  schedule:
    - cron: '30 1 * * *'

  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (scrape but do not save to DB)'
        required: false
        default: 'false'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60    # Kill if running longer than 1 hour

    steps:
      # 1. Checkout the scraper code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scraper/package-lock.json

      # 3. Install dependencies
      - name: Install dependencies
        working-directory: ./scraper
        run: npm ci

      # 4. Install Playwright browsers (Chromium only — reduces install time)
      - name: Install Playwright Chromium
        working-directory: ./scraper
        run: npx playwright install chromium --with-deps

      # 5. Run the scraper
      - name: Run e-com scraper
        working-directory: ./scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: node scrape-ecom.js

      # 6. Upload logs as artifact (useful for debugging failed runs)
      - name: Upload scrape log
        if: always()    # Run even if scraper failed
        uses: actions/upload-artifact@v4
        with:
          name: scrape-log-${{ github.run_id }}
          path: scraper/scrape-output.log
          retention-days: 7
          if-no-files-found: ignore
